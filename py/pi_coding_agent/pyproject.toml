[project]
name = "pi-coding-agent"
version = "0.1.0"
description = "Interactive coding agent CLI"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pi-agent",
    "pi-ai",
    "pi-tui",
    "filelock>=3.0",
    "pyyaml>=6.0",
    "Pillow",
    "httpx",
    "watchdog>=3.0; extra == 'watcher'",
]

[project.optional-dependencies]
watcher = ["watchdog>=3.0"]

[project.scripts]
pi = "pi_coding_agent.main:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["pi_coding_agent*"]

[tool.uv.sources]
pi-agent = { workspace = true }
pi-ai = { workspace = true }
pi-tui = { workspace = true }
