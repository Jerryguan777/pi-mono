[project]
name = "pi-mom"
version = "0.1.0"
description = "Slack bot delegating to pi agent"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pi-agent",
    "pi-ai",
    "slack-sdk>=3.0",
    "aiohttp>=3.0",
    "httpx>=0.27",
    "croniter>=2.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["pi_mom*"]

[tool.uv.sources]
pi-agent = { workspace = true }
pi-ai = { workspace = true }
