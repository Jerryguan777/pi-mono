[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-mono-python"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.80.0",
    "anthropic>=0.52.0",
    "google-genai>=1.14.0",
    "pydantic>=2.10.0",
    "jsonschema>=4.23.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.setuptools.packages.find]
include = ["pi_ai*", "pi_agent*", "pi_tools*", "pi_session*", "pi_coding_agent*", "benchmark*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
